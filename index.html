<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <h2 class="shop-title">Цветочная Лавка</h2>
    
    <div class="products-grid">
        <!-- Пример товара 1 -->
        <div class="card">
            <img src="https://via.placeholder.com/150/fce4ec/880e4f?text=Roses">
            <div class="card-title">Розы Red</div>
            <div class="card-price">1200 ₸ / шт.</div>
            
            <div class="quantity-selector">
                <input type="number" id="qty-rose" value="1" min="1">
                <div class="presets">
                    <button onclick="setQty('qty-rose', 1)">1</button>
                    <button onclick="setQty('qty-rose', 5)">5</button>
                    <button onclick="setQty('qty-rose', 25)">25</button>
                    <button onclick="setQty('qty-rose', 51)">51</button>
                    <button onclick="setQty('qty-rose', 101)">101</button>
                </div>
            </div>
            
            <button class="buy-btn" onclick="prepareOrder('Розы Red', 1200, 'qty-rose')">Купить</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
