<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <!-- Укажите здесь базовый URL API, если фронтенд размещается отдельно (например, Render) -->
    <meta name="api-base" content="">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <h2 class="shop-title">🌸 Цветочная Лавка</h2>
    <div class="shop-actions">
        <button id="refresh-btn" class="refresh-btn">Обновить список</button>
    </div>
    <div class="webapp-warning"></div>
    
    <div class="products-grid">
        <!-- Товары загружаются динамически -->
    </div>

    <!-- Модальное окно подтверждения заказа -->
    <div id="order-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 class="modal-title">Подтверждение заказа</h3>
            <div id="modal-order-info" class="modal-order-info"></div>
            <div class="modal-form">
                <label for="modal-name">Имя *</label>
                <input type="text" id="modal-name" placeholder="Ваше имя" required>
                <label for="modal-address">Адрес доставки *</label>
                <input type="text" id="modal-address" placeholder="Город, улица, дом, квартира" required>
            </div>
            <div class="modal-actions">
                <button id="modal-cancel" class="modal-btn modal-btn-cancel">Отмена</button>
                <button id="modal-confirm" class="modal-btn modal-btn-confirm">Оформить</button>
            </div>
        </div>
    </div>

    <!-- Уведомление -->
    <div id="toast" class="toast"></div>

    <script src="/static/script.js"></script>
</body>
</html>
